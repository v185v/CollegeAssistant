services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: college
      POSTGRES_USER: college
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or local .env file}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata_pg18:/var/lib/postgresql

volumes:
  pgdata_pg18: {}
